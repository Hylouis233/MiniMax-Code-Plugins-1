name: One-shot cli-agent-bridge Windows fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-cli-agent-bridge-windows-fix.yml'

permissions:
  contents: write

jobs:
  patch-test-push:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b18
        with:
          ref: agent/cli-agent-bridge-windows-fix
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply exact Windows fixes
        shell: python
        run: |
          from pathlib import Path

          server = Path('plugins/Hylouis233/cli-agent-bridge/server.mjs')
          text = server.read_text(encoding='utf-8')
          old = '''  const normalizeWorktree = (value) => {\n    return path.resolve(String(value ?? ""));\n  };'''
          new = '''  const normalizeWorktree = (value) => {\n    const resolved = path.resolve(String(value ?? ""));\n    return process.platform === "win32" ? resolved.toLowerCase() : resolved;\n  };'''
          if text.count(old) != 1:
              raise SystemExit(f'normalizeWorktree match count: {text.count(old)}')
          server.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

          tests = Path('plugins/Hylouis233/cli-agent-bridge/tests/server.test.mjs')
          text = tests.read_text(encoding='utf-8')
          old = '''    await waitFor(async () => (await events(eventFile)).some(\n      (item) => item.name === "deadline-holder" && item.event === "start",\n    ));'''
          new = '''    await waitFor(async () => (await events(eventFile)).some(\n      (item) => item.name === "deadline-holder" && item.event === "start",\n    ), process.platform === "win32" ? 30_000 : 10_000);'''
          if text.count(old) != 1:
              raise SystemExit(f'deadline holder wait match count: {text.count(old)}')
          tests.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
      - name: Cross-process deadline regression
        shell: pwsh
        run: node --test --test-name-pattern="a cross-process lock waiter obeys the delegation deadline" plugins/Hylouis233/cli-agent-bridge/tests/server.test.mjs
      - name: Provenance bounded regression
        shell: pwsh
        run: node --test --test-name-pattern="provenance reads are bounded and interruptible" plugins/Hylouis233/cli-agent-bridge/tests/server.test.mjs
      - name: Successive fetch regression
        shell: pwsh
        run: node --test --test-name-pattern="successive fetches are detected even after FETCH_HEAD is overwritten" plugins/Hylouis233/cli-agent-bridge/tests/server.test.mjs
      - name: Partial fetch regression
        shell: pwsh
        run: node --test --test-name-pattern="a partially successful nonzero fetch makes provenance uncertain" plugins/Hylouis233/cli-agent-bridge/tests/server.test.mjs
      - name: Windows process-tree suite
        run: node --test plugins/Hylouis233/cli-agent-bridge/tests/process-tree.test.mjs
      - name: Original integration suite
        run: node --test plugins/Hylouis233/cli-agent-bridge/test/server.test.mjs
      - name: Commit validated candidate
        shell: bash
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugins/Hylouis233/cli-agent-bridge/server.mjs plugins/Hylouis233/cli-agent-bridge/tests/server.test.mjs
          git commit -m 'fix: normalize Windows provenance and deadline fixture'
          git push origin HEAD:agent/cli-agent-bridge-windows-fix
