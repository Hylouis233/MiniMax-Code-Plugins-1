name: Stop stalled audit validation

on:
  pull_request:
    types: [opened]
    branches: [main]

permissions: {}

jobs:
  stop-audit-run:
    if: >-
      github.repository == 'Hylouis233/MiniMax-Code-Plugins-1' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'audit/stop-stalled-validation-20260905' &&
      github.event.pull_request.user.login == 'Hylouis233'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: write
    steps:
      - name: Cancel only the unchanged audit run after twenty minutes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import datetime
          import json
          import os
          import urllib.error
          import urllib.request

          repo = 'Hylouis233/MiniMax-Code-Plugins-1'
          run_id = 33947265965
          expected_head = '902b194f0624a1e287a3ba5ee962ba5fc97fb276'
          url = f'https://api.github.com/repos/{repo}/actions/runs/{run_id}'
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'X-GitHub-Api-Version': '2026-03-10',
          }
          req = urllib.request.Request(url, headers=headers)
          with urllib.request.urlopen(req, timeout=30) as response:
              run = json.load(response)
          assert run['repository']['full_name'] == repo
          assert run['head_sha'] == expected_head
          assert run['head_branch'] == 'plugin/cli-agent-bridge'
          assert run['event'] == 'pull_request'
          assert run['actor']['login'] == 'Hylouis233'
          assert any(pr['number'] == 5 and pr['base']['repo']['id'] == 1339350174
                     for pr in run['pull_requests'])
          if run['status'] == 'completed':
              print('Run already completed; no cancellation requested:', run['conclusion'])
          else:
              started = datetime.datetime.fromisoformat(run['run_started_at'].replace('Z', '+00:00'))
              elapsed = (datetime.datetime.now(datetime.timezone.utc) - started).total_seconds()
              assert elapsed >= 1200, 'Refusing to interrupt a run younger than twenty minutes'
              req = urllib.request.Request(url + '/cancel', headers=headers, data=b'', method='POST')
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      assert response.status == 202
                      print('Cancellation accepted for the single audit run', run_id)
              except urllib.error.HTTPError as error:
                  if error.code != 409:
                      raise RuntimeError(f'Cancellation denied with HTTP {error.code}') from None
                  print('Run changed state before cancellation; HTTP 409. Recheck actual status.')
          PY
