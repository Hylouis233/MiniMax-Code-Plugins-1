name: Bridge post-merge integration
on:
  push:
    branches: [audit/bridge-stability-20260911]
    paths: [.github/workflows/bridge-postmerge-integration.yml]
permissions:
  contents: read
jobs:
  integration:
    if: github.repository == 'Hylouis233/MiniMax-Code-Plugins-1' && github.actor == 'Hylouis233'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: a71f9622ef8ca9896434737dfd7b7706ca3c8ccd
          fetch-depth: 2
          persist-credentials: false
      - name: Verify the exact follow-up and component identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = a71f9622ef8ca9896434737dfd7b7706ca3c8ccd
          test "$(git rev-parse HEAD^)" = dda9e0b4e72e0fc4ff10c7cf938e89a732d25f2c
          test "$(git rev-parse HEAD^{tree})" = d5e0e45cd0dc11ec34aedfbda1f860bef55ef07e
          test "$(git rev-parse HEAD:plugins/Hylouis233/cli-agent-bridge)" = 601154fd73d8d9868e6fc516c15c51dc136eb265
          test "$(git diff-tree --no-commit-id --name-only -r HEAD | wc -l)" -eq 3
          git diff HEAD^ HEAD --check
          git rev-parse HEAD HEAD^{tree} HEAD:plugins/Hylouis233/cli-agent-bridge > verified-refs.txt
          git diff-tree --no-commit-id --name-only -r HEAD > changed-files.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: plugins/Hylouis233/document-skills/tests/requirements-fixtures.txt
      - run: npm ci
      - name: Complete the unmodified root check
        run: |
          set -euo pipefail
          npm run check 2>&1 | tee postmerge-root.tap
      - name: Install the existing pinned document fixture dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer
          python -m pip install -r plugins/Hylouis233/document-skills/tests/requirements-fixtures.txt
      - name: Recheck document fixtures on the combined tree
        run: |
          set -euo pipefail
          node --test plugins/Hylouis233/document-skills/tests/fixtures.integration.mjs 2>&1 | tee postmerge-document.tap
      - name: Confirm no tracked source changed
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code
          test "$(git rev-parse HEAD^{tree})" = d5e0e45cd0dc11ec34aedfbda1f860bef55ef07e
      - name: Preserve the exact post-merge validation output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bridge-postmerge-integration
          path: |
            verified-refs.txt
            changed-files.txt
            postmerge-root.tap
            postmerge-document.tap
          retention-days: 7
          if-no-files-found: error
