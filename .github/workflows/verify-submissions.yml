name: Verify plugin submissions

on:
  pull_request:
    paths:
      - "registry/*.json"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b18 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify changed registry entries
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mapfile -t entries < <(git diff --diff-filter=AM --name-only "$BASE_SHA" HEAD -- 'registry/*.json' | sort)
          if (( ${#entries[@]} > 0 )); then
            npm run verify -- "${entries[@]}"
          fi
